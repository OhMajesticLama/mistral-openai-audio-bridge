[package]
name = "vibe-audio-bridge"
version = "0.1.0"
edition = "2024"
description = "Vibe voice-mode bridge: Mistral realtime transcription WebSocket protocol -> OpenAI-compatible /v1/audio/transcriptions endpoint"
license = "MIT"
authors = ["ohmajesticlama <ohmajesticlama@gmail.com>"]
readme = "README.md"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
clap = { version = "4.6.7", features = ["derive", "env"] }

[dev-dependencies]
tokio-tungstenite = "0.26"

[[test]]
name = "unit_wav"
path = "tests/unit/wav.rs"

[[test]]
name = "unit_config"
path = "tests/unit/config.rs"

[[test]]
name = "unit_cli"
path = "tests/unit/cli.rs"

[[test]]
name = "integration_protocol"
path = "tests/integration/protocol.rs"

[[test]]
name = "system_transcription"
path = "tests/system/transcription.rs"

[[test]]
name = "system_cli"
path = "tests/system/cli.rs"

[profile.release]
strip = true
